<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the theme before first paint to avoid a light/dark flash:
      // stored choice first, otherwise the OS preference.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111113");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gerbinguio — CRM & Automation Specialist" />
    <meta
      property="og:description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gerbinguio — CRM & Automation Specialist" />
    <meta
      name="twitter:description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <title>Gerbinguio — CRM & Automation Specialist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
