<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gerbinguio — CRM & Automation Specialist" />
    <meta
      property="og:description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gerbinguio — CRM & Automation Specialist" />
    <meta
      name="twitter:description"
      content="Gerbinguio Victorino — CRM & Automation Specialist. I design and build end-to-end CRM systems and automation workflows."
    />
    <title>Gerbinguio — CRM & Automation Specialist</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
